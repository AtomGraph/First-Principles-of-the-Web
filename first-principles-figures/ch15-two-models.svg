<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 880 410" role="img" style="max-width: 880px; background-color: white;" font-family="Georgia, 'Times New Roman', serif" fill="#1b1e22">
  <title>The same graph, held by two parties, in both models</title>
  <desc>On the left, the property graph: the operator's graph identifies Panel 14 by a uuid property and feeds it to a Site 3 node, while the contractor's graph identifies the same panel by an assetId property with a different value. A dashed line between the two panel nodes is labelled "same panel?" and nothing in the model answers it. On the right, RDF: both parties use the same global name for the panel, so a solid line joins them and the two graphs merge by union.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6270"/>
    </marker>
  </defs>

  <g font-size="17">
    <text x="224" y="28" text-anchor="middle">Property graph</text>
    <text x="656" y="28" text-anchor="middle">RDF</text>
  </g>
  <line x1="440" y1="12" x2="440" y2="402" stroke="#d9d3c5"/>

  <!-- ================= left: property graph ================= -->
  <rect x="36" y="58" width="376" height="126" rx="8" fill="#f4f1e9" stroke="#d9d3c5" stroke-dasharray="4,4"/>
  <text x="50" y="78" font-size="12" fill="#5a6270">Operator's graph</text>
  <rect x="50" y="100" width="140" height="46" rx="8" fill="#e3eef7" stroke="#005a9c"/>
  <text x="120" y="118" font-size="13.5" text-anchor="middle">Panel 14</text>
  <text x="120" y="135" font-size="11.5" text-anchor="middle" fill="#5a6270" font-family="ui-monospace, Menlo, monospace">uuid: "9f2c…"</text>
  <rect x="268" y="100" width="120" height="46" rx="8" fill="#e3eef7" stroke="#005a9c"/>
  <text x="328" y="126" font-size="13.5" text-anchor="middle">Site 3</text>
  
  <line x1="190" y1="123" x2="262" y2="123" stroke="#5a6270" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="226" y="116" font-size="11.5" text-anchor="middle" fill="#5a6270" font-family="ui-monospace, Menlo, monospace">FEEDS</text>

  <rect x="36" y="240" width="376" height="96" rx="8" fill="#f4f1e9" stroke="#d9d3c5" stroke-dasharray="4,4"/>
  <text x="50" y="260" font-size="12" fill="#5a6270">Contractor's graph</text>
  <rect x="50" y="272" width="140" height="46" rx="8" fill="#e3eef7" stroke="#005a9c"/>
  <text x="120" y="290" font-size="13.5" text-anchor="middle">Panel 14</text>
  <text x="120" y="307" font-size="11.5" text-anchor="middle" fill="#5a6270" font-family="ui-monospace, Menlo, monospace">assetId: "P-14"</text>

  <line x1="120" y1="184" x2="120" y2="240" stroke="#5a6270" stroke-width="1.4" stroke-dasharray="5,5"/>
  <rect x="66" y="197" width="108" height="24" rx="4" fill="#fffdf9" stroke="#d9d3c5"/>
  <text x="120" y="214" font-size="12.5" text-anchor="middle" fill="#5a6270">same panel?</text>

  <!-- ================= right: the derived model ================= -->
  <rect x="468" y="58" width="376" height="126" rx="8" fill="#f4f1e9" stroke="#d9d3c5" stroke-dasharray="4,4"/>
  <text x="482" y="78" font-size="12" fill="#5a6270">Operator's graph</text>
  <rect x="488" y="100" width="150" height="46" rx="8" fill="#e3eef7" stroke="#005a9c"/>
  <text x="563" y="128" font-size="12.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">⟨…#panel-14⟩</text>
  <rect x="700" y="100" width="132" height="46" rx="8" fill="#e3eef7" stroke="#005a9c"/>
  <text x="766" y="128" font-size="12.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">⟨…#site-3⟩</text>
  <line x1="638" y1="123" x2="694" y2="123" stroke="#5a6270" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="666" y="116" font-size="11.5" text-anchor="middle" fill="#5a6270" font-family="ui-monospace, Menlo, monospace">feeds</text>

  <rect x="468" y="240" width="376" height="96" rx="8" fill="#f4f1e9" stroke="#d9d3c5" stroke-dasharray="4,4"/>
  <text x="482" y="260" font-size="12" fill="#5a6270">Contractor's graph</text>
  <rect x="488" y="272" width="150" height="46" rx="8" fill="#e3eef7" stroke="#005a9c"/>
  <text x="563" y="300" font-size="12.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">⟨…#panel-14⟩</text>

  <line x1="563" y1="184" x2="563" y2="240" stroke="#005a9c" stroke-width="1.6"/>
  <rect x="505" y="197" width="116" height="24" rx="4" fill="#fffdf9" stroke="#005a9c"/>
  <text x="563" y="214" font-size="12.5" text-anchor="middle">same name</text>

  <!-- ================= captions ================= -->
  <g font-size="13" text-anchor="middle" fill="#5a6270">
    <text x="224" y="370">Each graph identifies the panel its own way.</text>
    <text x="224" y="389">Agreeing is work done outside the model.</text>
    <text x="656" y="370">Both graphs name the panel the same way,</text>
    <text x="656" y="389">so their union is the merge.</text>
  </g>
</svg>
