<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 92 540 360" role="img">
  <title>A transparent object: a document read out, a change written back</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b1e22"/>
    </marker>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the object, transparent -->
    <rect x="150" y="156" width="168" height="168" rx="26" fill="#ffffff" stroke="#1b1e22" stroke-width="2.5"/>
    <!-- interior, visible but not yet resolved -->
    <g stroke="#d8dce1" stroke-width="2">
      <rect x="180" y="192" width="54" height="34" rx="7"/>
      <rect x="214" y="252" width="72" height="28" rx="7"/>
      <circle cx="272" cy="206" r="8"/>
      <circle cx="190" cy="290" r="7"/>
      <path d="M186 240 L232 240"/>
    </g>
    <!-- read: straight out to the document -->
    <path d="M318 204 L438 204" stroke="#1b1e22" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="380" y="188" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#5a6270" text-anchor="middle" stroke="none">read</text>
    <!-- the document -->
    <rect x="450" y="140" width="120" height="164" rx="9" fill="#ffffff" stroke="#005a9c" stroke-width="2.5"/>
    <rect x="470" y="164" width="52" height="11" rx="4" fill="#005a9c" stroke="none"/>
    <g fill="#e3eef7" stroke="none">
      <rect x="470" y="196" width="80" height="7" rx="3.5"/>
      <rect x="470" y="215" width="64" height="7" rx="3.5"/>
      <rect x="470" y="234" width="80" height="7" rx="3.5"/>
      <rect x="470" y="253" width="52" height="7" rx="3.5"/>
      <rect x="470" y="272" width="72" height="7" rx="3.5"/>
    </g>
    <!-- write: the round trip back in -->
    <path d="M486 316 C478 392 348 402 272 334" stroke="#1b1e22" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="398" y="400" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#5a6270" text-anchor="middle" stroke="none">write</text>
  </g>
</svg>
