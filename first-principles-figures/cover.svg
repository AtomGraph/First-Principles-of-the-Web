<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2560" viewBox="0 0 1600 2560" role="img">
  <title>First Principles of the Web — cover</title>
  <rect x="0" y="0" width="1600" height="2560" fill="#ffffff"/>
  <!-- frame accent bars -->
  <rect x="0" y="0" width="1600" height="18" fill="#005a9c"/>
  <rect x="0" y="2542" width="1600" height="18" fill="#005a9c"/>

  <!-- eyebrow -->
  <text x="800" y="332" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="34" letter-spacing="8" fill="#5a6270">DRAFT 0.1</text>

  <!-- title -->
  <text x="800" y="560" text-anchor="middle" font-family="EB Garamond" font-weight="700" font-size="148" fill="#1b1e22">First Principles</text>
