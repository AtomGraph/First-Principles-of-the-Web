  <rect x="700" y="784" width="200" height="6" rx="3" fill="#005a9c"/>

  <!-- subtitle -->
  <text x="800" y="902" text-anchor="middle" font-family="EB Garamond" font-style="italic" font-weight="500" font-size="46" fill="#5a6270">Graphs are not the thing, they are</text>
  <text x="800" y="964" text-anchor="middle" font-family="EB Garamond" font-style="italic" font-weight="500" font-size="46" fill="#5a6270">the thing that gets us to the thing.</text>

