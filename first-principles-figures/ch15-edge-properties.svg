<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 880 300" role="img" style="max-width: 880px; background-color: white;" font-family="Georgia, 'Times New Roman', serif" fill="#1b1e22">
  <title>Saying something about a relationship, in both models</title>
  <desc>On the left, the property graph: a FEEDS relationship runs from Panel 14 to Site 3, and the property "since: 2021" hangs directly on that relationship. On the right, the derived model: the same feeds edge runs between two globally named nodes, but to say when it began the fact itself must first be given a name, and the annotation is then stated about that name.</desc>

  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6270"/>
    </marker>
  </defs>

  <g font-size="17">
    <text x="224" y="28" text-anchor="middle">Property graph</text>
    <text x="656" y="28" text-anchor="middle">The derived model</text>
  </g>
  <line x1="440" y1="12" x2="440" y2="292" stroke="#d9d3c5"/>

  <!-- ================= left ================= -->
  <rect x="44" y="96" width="124" height="46" rx="8" fill="#e3eef7" stroke="#005a9c"/>
  <text x="106" y="124" font-size="13.5" text-anchor="middle">Panel 14</text>
  <rect x="280" y="96" width="110" height="46" rx="8" fill="#e3eef7" stroke="#005a9c"/>
  <text x="335" y="124" font-size="13.5" text-anchor="middle">Site 3</text>
  <line x1="168" y1="119" x2="274" y2="119" stroke="#5a6270" stroke-width="1.4" marker-end="url(#ar2)"/>
  <text x="221" y="112" font-size="11.5" text-anchor="middle" fill="#5a6270" font-family="ui-monospace, Menlo, monospace">FEEDS</text>

  <line x1="221" y1="123" x2="221" y2="162" stroke="#5a6270" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="160" y="162" width="124" height="38" rx="4" fill="#fffdf9" stroke="#005a9c"/>
  <text x="222" y="186" font-size="12.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">since: 2021</text>

  <g font-size="13" text-anchor="middle" fill="#5a6270">
    <text x="224" y="250">The property hangs on the relationship,</text>
    <text x="224" y="269">and nothing else is needed.</text>
  </g>

  <!-- ================= right ================= -->
  <rect x="470" y="96" width="150" height="46" rx="8" fill="#e3eef7" stroke="#005a9c"/>
  <text x="545" y="124" font-size="12.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">⟨…#panel-14⟩</text>
  <rect x="724" y="96" width="132" height="46" rx="8" fill="#e3eef7" stroke="#005a9c"/>
  <text x="790" y="124" font-size="12.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">⟨…#site-3⟩</text>
  <line x1="620" y1="119" x2="718" y2="119" stroke="#5a6270" stroke-width="1.4" marker-end="url(#ar2)"/>
  <text x="669" y="112" font-size="11.5" text-anchor="middle" fill="#5a6270" font-family="ui-monospace, Menlo, monospace">feeds</text>

  <line x1="669" y1="123" x2="620" y2="160" stroke="#5a6270" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="560" y="162" width="104" height="38" rx="8" fill="#e3eef7" stroke="#005a9c"/>
  <text x="612" y="186" font-size="12.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">⟨…#f1⟩</text>
  <line x1="664" y1="181" x2="724" y2="181" stroke="#5a6270" stroke-width="1.4" marker-end="url(#ar2)"/>
  <text x="694" y="174" font-size="11.5" text-anchor="middle" fill="#5a6270" font-family="ui-monospace, Menlo, monospace">since</text>
  <rect x="730" y="162" width="86" height="38" rx="4" fill="#fffdf9" stroke="#005a9c"/>
  <text x="773" y="186" font-size="12.5" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">2021</text>

  <g font-size="13" text-anchor="middle" fill="#5a6270">
    <text x="656" y="250">The fact must be named before anything</text>
    <text x="656" y="269">can be said about it.</text>
  </g>
</svg>
