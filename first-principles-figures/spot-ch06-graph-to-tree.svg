<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 85 630 315" role="img">
  <title>One graph, two of its many trees; the twice-claimed node nests once and is referenced once</title>
  <defs>
    <marker id="gte-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b1e22"/>
    </marker>
    <marker id="gte-fan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6270"/>
    </marker>
    <marker id="gte-ref" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#005a9c"/>
    </marker>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the graph: d claimed by both b and c -->
    <g stroke="#1b1e22" stroke-width="2" marker-end="url(#gte-ink)">
      <path d="M142 126 L94 188"/>
      <path d="M159 126 L205 179"/>
      <path d="M93 211 L131 263"/>
      <path d="M206 200 L150 264"/>
      <path d="M224 201 L271 258"/>
      <path d="M270 280 L215 339"/>
    </g>
    <!-- the crossing: one graph, more trees than these -->
    <g stroke="#5a6270" stroke-width="1.8" stroke-dasharray="2 6">
      <path d="M316 218 Q348 180 381 154" marker-end="url(#gte-fan)"/>
      <path d="M316 240 Q348 278 381 296" marker-end="url(#gte-fan)"/>
    </g>
    <!-- tree one: d nests under b; c keeps a reference -->
    <g stroke="#1b1e22" stroke-width="2.4">
      <path d="M412 139 L458 116"/>
      <path d="M411 151 L459 179"/>
      <path d="M483 110 L527 110"/>
      <path d="M483 185 L527 185"/>
      <path d="M553 185 L597 185"/>
    </g>
    <path d="M480 175 Q500 148 529 123" stroke="#005a9c" stroke-width="2.2" stroke-dasharray="5 5" marker-end="url(#gte-ref)"/>
    <!-- tree two: d nests under c; the siblings trade places -->
    <g stroke="#1b1e22" stroke-width="2.4">
      <path d="M412 294 L458 271"/>
      <path d="M411 306 L459 334"/>
      <path d="M482 261 L528 244"/>
      <path d="M482 269 L528 286"/>
      <path d="M553 290 L597 290"/>
    </g>
    <path d="M478 329 Q512 295 531 253" stroke="#005a9c" stroke-width="2.2" stroke-dasharray="5 5" marker-end="url(#gte-ref)"/>
    <!-- the nodes, the same six every time -->
    <g stroke="#1b1e22" stroke-width="2" fill="#005a9c">
      <circle cx="150" cy="115" r="12"/>
      <circle cx="85" cy="200" r="12"/>
      <circle cx="215" cy="190" r="12"/>
      <circle cx="140" cy="275" r="12"/>
      <circle cx="280" cy="270" r="12"/>
      <circle cx="205" cy="350" r="12"/>
      <circle cx="400" cy="145" r="12"/>
      <circle cx="470" cy="110" r="12"/>
      <circle cx="470" cy="185" r="12"/>
      <circle cx="540" cy="110" r="12"/>
      <circle cx="540" cy="185" r="12"/>
      <circle cx="610" cy="185" r="12"/>
      <circle cx="400" cy="300" r="12"/>
      <circle cx="470" cy="265" r="12"/>
      <circle cx="470" cy="340" r="12"/>
      <circle cx="540" cy="240" r="12"/>
      <circle cx="540" cy="290" r="12"/>
      <circle cx="610" cy="290" r="12"/>
    </g>
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle" stroke="none">
      <text x="150" y="119.5">a</text>
      <text x="85" y="204.5">b</text>
      <text x="215" y="194.5">c</text>
      <text x="140" y="279.5">d</text>
      <text x="280" y="274.5">e</text>
      <text x="205" y="354.5">f</text>
      <text x="400" y="149.5">a</text>
      <text x="470" y="114.5">b</text>
      <text x="470" y="189.5">c</text>
      <text x="540" y="114.5">d</text>
      <text x="540" y="189.5">e</text>
      <text x="610" y="189.5">f</text>
      <text x="400" y="304.5">a</text>
      <text x="470" y="269.5">c</text>
      <text x="470" y="344.5">b</text>
      <text x="540" y="244.5">d</text>
      <text x="540" y="294.5">e</text>
      <text x="610" y="294.5">f</text>
    </g>
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#5a6270" text-anchor="middle" stroke="none">
      <text x="182" y="391">one graph</text>
      <text x="505" y="391">many trees</text>
    </g>
  </g>
</svg>
