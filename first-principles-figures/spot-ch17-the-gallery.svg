<svg xmlns="http://www.w3.org/2000/svg" viewBox="66 54 528 352" role="img">
  <title>What the agent finds: a picture of a document, behind a rope</title>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- floor -->
    <path d="M90 372 L580 372" stroke="#5a6270" stroke-width="1.5"/>
    <!-- the exhibit: a rendered page -->
    <circle cx="245" cy="76" r="2.5" fill="#1b1e22" stroke="none"/>
    <g stroke="#1b1e22" stroke-width="1.5">
      <path d="M245 78 L158 94"/>
      <path d="M245 78 L332 94"/>
    </g>
    <rect x="150" y="92" width="190" height="238" stroke="#1b1e22" stroke-width="2.6"/>
    <rect x="162" y="104" width="166" height="214" fill="#ffffff" stroke="#1b1e22" stroke-width="1.6"/>
    <rect x="180" y="126" width="64" height="12" rx="3" fill="#5a6270" stroke="none"/>
    <g stroke="#d8dce1" stroke-width="5">
      <path d="M180 160 L310 160"/>
      <path d="M180 182 L288 182"/>
      <path d="M180 204 L310 204"/>
      <path d="M180 226 L272 226"/>
      <path d="M180 248 L302 248"/>
    </g>
    <rect x="180" y="270" width="96" height="32" rx="4" fill="#e3eef7" stroke="none"/>
    <!-- blank gallery plaque -->
    <rect x="215" y="344" width="60" height="15" rx="4" fill="#ffffff" stroke="#1b1e22" stroke-width="1.8"/>
    <path d="M228 352 q4 -5 8 0 t8 0 t8 0" stroke="#5a6270" stroke-width="1.5"/>
    <!-- the rope -->
    <g stroke="#1b1e22" stroke-width="2.2">
      <path d="M120 372 L120 270"/>
      <path d="M390 372 L390 270"/>
    </g>
    <path d="M120 272 Q255 322 390 272" stroke="#5a6270" stroke-width="2.5"/>
    <g stroke="#1b1e22" stroke-width="2" fill="#e3eef7">
      <circle cx="120" cy="263" r="6.5"/>
      <circle cx="390" cy="263" r="6.5"/>
    </g>
    <g stroke="#1b1e22" stroke-width="1.8" fill="#ffffff">
      <ellipse cx="120" cy="372" rx="16" ry="4.5"/>
      <ellipse cx="390" cy="372" rx="16" ry="4.5"/>
    </g>
    <!-- the user agent -->
    <g stroke="#1b1e22" stroke-width="2.2">
      <path d="M462 188 L428 200 L406 186"/>
      <path d="M530 188 L546 234"/>
      <path d="M482 260 L482 360"/>
      <path d="M512 260 L512 360"/>
    </g>
    <rect x="470" y="118" width="52" height="42" rx="9" fill="#ffffff" stroke="#1b1e22" stroke-width="2.4"/>
    <circle cx="484" cy="140" r="8" fill="#005a9c" stroke="none"/>
    <path d="M496 118 L496 102" stroke="#1b1e22" stroke-width="2"/>
    <circle cx="496" cy="97" r="3.5" fill="#e3eef7" stroke="#1b1e22" stroke-width="2"/>
    <path d="M496 160 L496 170" stroke="#1b1e22" stroke-width="2.4"/>
    <rect x="462" y="170" width="68" height="90" rx="10" fill="#ffffff" stroke="#1b1e22" stroke-width="2.4"/>
    <rect x="478" y="190" width="36" height="24" rx="4" stroke="#d8dce1" stroke-width="1.5"/>
    <g fill="#5a6270" stroke="none">
      <circle cx="486" cy="222" r="2"/>
      <circle cx="498" cy="222" r="2"/>
    </g>
    <!-- the magnifier, raised over the rope -->
    <circle cx="388" cy="166" r="16" stroke="#1b1e22" stroke-width="2.4"/>
    <path d="M399 178 L406 186" stroke="#1b1e22" stroke-width="2.4"/>
    <circle cx="406" cy="186" r="4" fill="#ffffff" stroke="#1b1e22" stroke-width="2"/>
    <circle cx="546" cy="238" r="4" fill="#ffffff" stroke="#1b1e22" stroke-width="2"/>
    <g stroke="#1b1e22" stroke-width="2.2" fill="#ffffff">
      <rect x="468" y="360" width="28" height="12" rx="6"/>
      <rect x="498" y="360" width="28" height="12" rx="6"/>
    </g>
  </g>
</svg>
