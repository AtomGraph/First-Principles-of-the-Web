<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 96 540 360" role="img">
  <title>Atoms composing upward from the clean column, next tier open</title>
  <defs>
    <g id="ck5" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-8 0 L-2 7 L9 -7"/>
    </g>
    <g id="tri" stroke="#1b1e22" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-26 12 L0 -14 L26 12" fill="none"/>
      <circle cx="-26" cy="12" r="8.5" fill="#e3eef7"/>
      <circle cx="0" cy="-14" r="8.5" fill="#e3eef7"/>
      <circle cx="26" cy="12" r="8.5" fill="#e3eef7"/>
    </g>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- union: what merges, stands -->
    <g stroke="#5a6270" stroke-width="1.5">
      <path d="M296 364 L289 294"/>
      <path d="M334 364 L341 294"/>
      <path d="M386 364 L379 294"/>
      <path d="M424 364 L431 294"/>
      <path d="M315 268 L334 224"/>
      <path d="M405 268 L386 224"/>
    </g>
    <g stroke="#d8dce1" stroke-width="1.5">
      <path d="M244 372 L244 398"/>
      <path d="M296 372 L296 398"/>
      <path d="M334 372 L334 398"/>
      <path d="M386 372 L386 398"/>
      <path d="M424 372 L424 398"/>
      <path d="M476 372 L476 398"/>
    </g>
    <!-- the next tier, waiting to be occupied -->
    <g stroke="#d8dce1" stroke-width="1.8" stroke-dasharray="3 6">
      <path d="M360 198 L334 154"/>
      <path d="M360 198 L386 154"/>
      <path d="M334 154 L360 128 L386 154"/>
      <circle cx="334" cy="154" r="8.5"/>
      <circle cx="360" cy="128" r="8.5"/>
      <circle cx="386" cy="154" r="8.5"/>
    </g>
    <!-- the atoms, composed -->
    <use href="#tri" x="270" y="352"/>
    <use href="#tri" x="360" y="352"/>
    <use href="#tri" x="450" y="352"/>
    <use href="#tri" x="315" y="282"/>
    <use href="#tri" x="405" y="282"/>
    <use href="#tri" x="360" y="212"/>
    <!-- the column with no failures, laid down as the foundation -->
    <rect x="210" y="398" width="300" height="34" rx="7" fill="#e3eef7" stroke="#005a9c" stroke-width="2.5"/>
    <g color="#005a9c">
      <use href="#ck5" transform="translate(244 415) scale(0.62)"/>
      <use href="#ck5" transform="translate(283 415) scale(0.62)"/>
      <use href="#ck5" transform="translate(322 415) scale(0.62)"/>
      <use href="#ck5" transform="translate(361 415) scale(0.62)"/>
      <use href="#ck5" transform="translate(400 415) scale(0.62)"/>
      <use href="#ck5" transform="translate(439 415) scale(0.62)"/>
      <use href="#ck5" transform="translate(478 415) scale(0.62)"/>
    </g>
  </g>
</svg>
