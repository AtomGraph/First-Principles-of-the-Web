<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 8 620 412" role="img">
  <title>Lateral churn: brackets ride the loop; the ladder goes unused</title>
  <defs>
    <marker id="mah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6270"/>
    </marker>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <path d="M50 372 L610 372" stroke="#5a6270" stroke-width="1.5"/>
    <!-- the loop -->
    <ellipse cx="260" cy="310" rx="190" ry="62" fill="#ffffff" stroke="#1b1e22" stroke-width="2.2"/>
    <ellipse cx="260" cy="310" rx="138" ry="36" fill="#ffffff" stroke="#1b1e22" stroke-width="2"/>
    <!-- circulation -->
    <g stroke="#5a6270" stroke-width="1.8" stroke-dasharray="2 6">
      <path d="M130 280 Q260 232 396 284" marker-end="url(#mah)"/>
      <path d="M400 342 Q262 386 128 336" marker-end="url(#mah)"/>
    </g>
    <!-- the riders -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="46" fill="#1b1e22" text-anchor="middle" stroke="none">
      <text x="172" y="356" letter-spacing="6">&lt;&gt;</text>
      <text x="352" y="362">{}</text>
    </g>
    <!-- the vertical direction, available the entire time -->
    <g stroke="#005a9c" stroke-width="2.5">
      <path d="M545 372 L545 8"/>
      <path d="M585 372 L585 8"/>
      <g stroke-width="2.2">
        <path d="M545 352 L585 352"/>
        <path d="M545 318 L585 318"/>
        <path d="M545 284 L585 284"/>
        <path d="M545 250 L585 250"/>
        <path d="M545 216 L585 216"/>
        <path d="M545 182 L585 182"/>
        <path d="M545 148 L585 148"/>
        <path d="M545 114 L585 114"/>
        <path d="M545 80 L585 80"/>
        <path d="M545 46 L585 46"/>
      </g>
    </g>
  </g>
</svg>
