<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 104 640 288" role="img">
  <title>Churn starts over; derivation compounds</title>
  <defs>
    <marker id="c22-tc-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#005a9c"/>
    </marker>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- the time axis -->
    <path d="M70 380 L640 380" stroke="#5a6270" stroke-width="1.5"/>
    <!-- the shared origin -->
    <circle cx="85" cy="380" r="3.5" fill="#1b1e22" stroke="none"/>
    <!-- churn: it climbs too, but keeps giving height back -->
    <path d="M85 380 L150 330 L175 362 L240 308 L265 344 L330 292 L355 330 L420 278 L445 318 L510 266 L535 306 L585 272"
          stroke="#5a6270" stroke-width="2"/>
    <!-- derivation: nothing is given back, so it compounds -->
    <path d="M85 380 C300 372 470 300 575 130" stroke="#005a9c" stroke-width="2.4" marker-end="url(#c22-tc-ah)"/>
    <!-- labels -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" text-anchor="start" stroke="none">
      <text x="598" y="277" fill="#5a6270">churn</text>
      <text x="592" y="124" fill="#005a9c">derivation</text>
    </g>
  </g>
</svg>
