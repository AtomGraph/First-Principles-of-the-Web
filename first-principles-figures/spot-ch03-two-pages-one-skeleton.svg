<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 20 470 430" role="img">
  <title>A newspaper front page and an analytics dashboard, as different as a pair can be, both draining down through the strip into one identical row of sorted blocks</title>
  <defs>
    <marker id="s3-fan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6270"/>
    </marker>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- labels -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#5a6270" text-anchor="middle" stroke="none">
      <text x="130" y="38">front page</text>
      <text x="390" y="38">dashboard</text>
    </g>
    <!-- LEFT: the newspaper front page — editorial, mostly words -->
    <g>
      <rect x="55" y="50" width="150" height="195" fill="#ffffff" stroke="#1b1e22" stroke-width="2.2"/>
      <rect x="70" y="65" width="120" height="16" fill="#e3eef7" stroke="none"/>
      <g stroke="#5a6270" stroke-width="2.4">
        <path d="M70 98 L190 98"/>
        <path d="M70 112 L158 112"/>
      </g>
      <rect x="70" y="126" width="120" height="52" fill="#e3eef7" stroke="none"/>
      <g stroke="#5a6270" stroke-width="1.6">
        <path d="M70 192 L190 192"/>
        <path d="M70 206 L182 206"/>
        <path d="M70 220 L190 220"/>
        <path d="M70 234 L150 234"/>
      </g>
    </g>
    <!-- RIGHT: the analytics dashboard — numbers and a canvas -->
    <g>
      <rect x="315" y="50" width="150" height="195" fill="#ffffff" stroke="#1b1e22" stroke-width="2.2"/>
      <rect x="330" y="65" width="55" height="44" fill="#ffffff" stroke="#5a6270" stroke-width="1.8"/>
      <rect x="395" y="65" width="55" height="44" fill="#ffffff" stroke="#5a6270" stroke-width="1.8"/>
      <g stroke="#5a6270" stroke-width="3">
        <path d="M342 92 L373 92"/>
        <path d="M407 92 L438 92"/>
      </g>
      <rect x="330" y="123" width="120" height="62" fill="#e3eef7" stroke="#5a6270" stroke-width="1.8"/>
      <polyline points="337 170 357 150 377 162 397 138 417 154 445 133" stroke="#5a6270" stroke-width="2"/>
      <g stroke="#5a6270" stroke-width="1.6">
        <path d="M330 202 L410 202"/>
        <path d="M330 216 L378 216"/>
        <path d="M330 230 L400 230"/>
      </g>
    </g>
    <!-- the drain: both pages reduce, the same way -->
    <g stroke="#5a6270" stroke-width="1.8" stroke-dasharray="2 6">
      <path d="M130 250 Q150 300 212 320" marker-end="url(#s3-fan)"/>
      <path d="M390 250 Q370 300 308 320" marker-end="url(#s3-fan)"/>
    </g>
    <!-- ONE skeleton, shared: the accent, the thing that matters -->
    <rect x="185" y="326" width="150" height="96" fill="#ffffff" stroke="#1b1e22" stroke-width="2.2"/>
    <g stroke="#005a9c" stroke-width="2" fill="#ffffff">
      <rect x="197" y="358" width="24" height="34"/>
      <rect x="231" y="358" width="24" height="34"/>
      <rect x="265" y="358" width="24" height="34"/>
      <rect x="299" y="358" width="24" height="34"/>
    </g>
    <text x="260" y="442" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#5a6270" text-anchor="middle" stroke="none">State</text>
  </g>
</svg>
