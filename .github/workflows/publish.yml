name: Publish book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Project the book (split.py)
        run: python3 split.py

      # Renders HTML + EPUB. Mermaid is pre-rendered to committed SVGs
      # (render-mermaid.py), so no headless browser is needed here.
      - name: Render
        run: quarto render

      # Make the EPUB valid + self-contained: swap dead video iframes for
      # embedded posters, quote boolean attrs. Pure stdlib, no browser.
      - name: Post-process EPUB
        run: python3 epub_fix.py _book/First-Principles-of-the-Web.epub video-posters

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
